[project]
name = "lenswire"
version = "0.1.0"
description = "A curated geopolitical news and editorial intelligence bot for FactLens."
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]==21.4",
  "feedparser==6.0.11",
  "httpx==0.27.2",
  "requests==2.32.3",
  "sentence-transformers==3.0.1",
  "trafilatura==1.12.2",
  "PyYAML==6.0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.6.9",
  "mypy==1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["app"]
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
